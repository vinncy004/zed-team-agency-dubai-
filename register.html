<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>signup</title>
    <style>
       *{
        padding: 0;
        margin: 0;
       }
       body{
        background-color: white;
        color: black;
       } /*styling for signup and login pages*/
 form{
    margin-top: 10vh;
    width: 98vw;
    margin-left: 5px;
 }
 input{
    margin-left: 5px;
    width: 90vw;
    height: 30px;
    border-top: none;
    border-left: none;
    border-right: none;
    border-bottom: 2px solid black;
 }
 #registerbtn{
     width: 90vw;
    height: 30px;
    background-color: rgb(223, 65, 25);
    color: azure;
    margin-left: 5px;
 }
#alink{
    text-decoration: none;
    font-size: 20px;
    color: azure;
 }
 legend{
    font-size: 20px;
   
 }
 #tc{
    width:20px;
    height: 20px;
 }
 #notify-img{
        width: 20px;
        height: 20px;
        border-radius: 50%;
    }
    #notification{
        display:none ;
        width: 80vw;
        height: 20vh;
        margin-top: 40vh;
        margin-left: 10px;
        margin-right: 10px;
        background-color: rgb(241, 239, 239);
        border: 1px solid rgb(94, 97, 97);
        color: black;
        font-size: 20px;
        position: absolute;
        z-index: 2;
        font-size: 20px;
        text-align: center;
        padding: 20px;
        
    }
    #close-notis{
        width: 50px;
        height: 20px;
        border-radius: 3px;
        color: rgb(7, 5, 5);
        background-color: rgb(66, 66, 158);
    }
    #noti-message{
        color: black;
        font-size: 25px;
    }
     #pass-success{
    position:absolute;
    top: 0;
    height: 40px;
    background-color:rgba(255, 255, 255, 0.699);
    color: rgb(29, 25, 25);
    width: 90vw;
    z-index: 2;
    margin-left: 20px;
    margin-right: 20px;
    text-align: center;
    display:none ;
    font-size: 20px;
    font-weight: bolder;

 }
    </style>
</head>
<body>
    <span id="pass-success"></span>
    <script src="index.js"></script>
    <form action="" method="get">
        <fieldset>
            <legend>
                register zed team
            </legend>
            <br>
             <div id="notification">
      <span id="notify-img">img</span>
      <br>
       <h3 id="notify">hey user</h3>
       <br>
       <p id="noti-message">hey user</p>
       <br>
       <button id="close-notis">OK</button>
    </div>
            <label for="phone">enter phone number:</label>
            <br>            <br>
            <input type="number" name="number" id="phone" placeholder="phonenumber" maxlength="10" minlength="10" required>
            <br>
             <span id="validphone"></span>
            <br>
            <label for="email">enter email :</label>
            <br><br>
            <input type="email"  id="email" placeholder="enter email e.g (abc@gmail.com)"  required>
            <br><br>
             <br><br>
            <label for="passwpord">enter password:</label>
            <br><br>
            <input type="password"  id="pass1" placeholder="enter strong password"  required>
            <br><br>
            <br><br>
            <label for="passwpord">repeat password:</label>
            <br><br>
            <input type="password"  id="pass2" placeholder="repeat password"  required>
            <br>
            <span id="pass-success"></span><br>

            <span id="reg">
                <button type="submit" id="registerbtn" onclick="valid()">register</button> 
            </span>
            <br><br>
        </fieldset>
    </form>
    <script>
      function valid(){
          let a= document.getElementById('pass1').value;
          let b=  document.getElementById('pass2').value;
          let c=  document.getElementById('pass-success');
           let d=  document.getElementById('reg');
          if(a!=b){
          
           
                c.style.display='inline';
                c.style.backgroundColor="red";
                c.innerHTML=`<p  style="color:white;">passwords do  not match</p>` 
        
          }else if((a===b)&&(a&&b!='') ){

            
            c.style.display='inline'
            c.style.backgroundColor="green"
            c.innerHTML=`<p style="color:white;">success proceed to register</p>`
            d.innerHTML=`<button id="registerbtn"><a href="register1.html" id="alink">register</a></button>`
            
          
             
          }else if(a===''||b==''){
            
                 c.style.display='inline'
                  c.style.backgroundColor="yellow"
                 c.innerHTML=`<p style="color:blue; backgroundColor:yellow">strong password includes special char</p>`
            
          }
      }    
      </script>
</body>
</html>
