    <script src="index.js"></script>
    <form action="" method="post">
        
            <br>
          
            <label for="phone">enter phone number:</label>
            <br>            <br>
            <input type="number" name="number" id="phone" placeholder="phonenumber" maxlength="10" minlength="10" required>
            <br>
             <span id="validphone"></span>
            <br>
            <label for="email">enter email :</label>
            <br><br>
            <input type="email"  id="email" placeholder="enter email e.g (abc@gmail.com)"  required>
            <br><br>
             <br><br>
            <label for="passwpord">enter password:</label>
            <br><br>
            <input type="password"  id="pass1" placeholder="enter strong password"  required>
            <br><br>
            <br><br>
            <label for="passwpord">repeat password:</label>
            <br><br>
            <input type="password"  id="pass2" placeholder="repeat password"  required>
            <br>
            <span id="pass-success"></span><br>

            <span id="reg">
                <button type="submit" id="registerbtn" onclick="valid()">register</button> 
            </span>
            <br><br>
       
    </form>
    <script>
      function valid(){
          let a= document.getElementById('pass1').value;
          let b=  document.getElementById('pass2').value;
          let c=  document.getElementById('pass-success');
           let d=  document.getElementById('reg');

          if((a!=b)){
                c.style.display='inline';
              
                c.innerHTML=`<p  style="color:red;">passwords do  not match</p>` 
                d.innerHTML=`<button type="submit" id="registerbtn" onclick="valid()">register</button> `
        
          }else if((a<7)&&(a&&b!="")){
                c.style.display='inline';
              
                c.innerHTML=`<p  style="color:red;">short password include symbols</p>` 
                d.innerHTML=`<button type="submit" id="registerbtn" onclick="valid()">register</button> `

          } else if((a===b)&&(a&&b!='')){

            
            c.style.display='inline'
            
            c.innerHTML=`<p style="color:green;">success proceed to register</p>`
            d.innerHTML=`<button id="registerbtn" onclick='valid()' ><a  href="register1.html" id="alink">register</a></button>`
            
          
             
          }else if((a==='')||(b==='')){
            
                 c.style.display='inline'
                  
                 c.innerHTML=`<p style="color:blue; backgroundColor:yellow">all fields required </p>`
            
          }
       
      }    
      </script>
