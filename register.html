<!DOCTYPE html>
<html lang="en">
<head>

    <title>signup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="" method="get">
        <fieldset>
            <legend>
                register zed
            </legend>
            <br>
            <label for="names">enter full names:</label>
            <br><br>
            <input type="text" name="number" id="name" placeholder="full names (e.g john doe)">
            <br><br>
            <label for="phone">enter phone number:</label>
            <br>            <br>
            <input type="number" name="number" id="phone" placeholder="phonenumber">
            <br>
             <span id="validphone"></span>
            <br>
            <label for="email">enter email :</label>
            <br><br>
            <input type="email"  id="email" placeholder="enter email e.g (abc@gmail.com)">
            <br><br>
             <br><br>
            <label for="passwpord">enter password:</label>
            <br><br>
            <input type="password"  id="pass1" placeholder="enter strong password">
            <br><br>
            <br><br>
            <label for="passwpord">repeat password:</label>
            <br><br>
            <input type="password"  id="pass2" placeholder="repeat password">
            <br><br>

            <button id="registerbtn"><a href="#"  onclick="notify()" id="alink">register</a></button>
            <br><br>
        </fieldset>
    </form>
