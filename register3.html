     (function () {
      const copyBtn = document.getElementById('copyBtn');
      const phoneEl = document.getElementById('phoneNumber');
      const feedback = document.getElementById('feedback');

      function showFeedback(text = 'Copied!', ms = 1500) {
        feedback.textContent = text;
        feedback.setAttribute('aria-hidden', 'false');
        feedback.classList.add('show');
        clearTimeout(showFeedback._t);
        showFeedback._t = setTimeout(() => {
          feedback.classList.remove('show');
          feedback.setAttribute('aria-hidden', 'true');
        }, ms);
      }

      async function copyTextToClipboard(text) {
        // Prefer modern API
        if (navigator.clipboard && navigator.clipboard.writeText) {
          try {
            await navigator.clipboard.writeText(text);
            return true;
          } catch (err) {
            // fall through to execCommand fallback
          }
        }

        // Fallback (older browsers)
        try {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          // Make it out of viewport & readonly to prevent mobile keyboard
          textarea.setAttribute('readonly', '');
          textarea.style.position = 'absolute';
          textarea.style.left = '-9999px';
          document.body.appendChild(textarea);
          const selection = document.getSelection();
          const prevRange = selection.rangeCount > 0 ? selection.getRangeAt(0) : null;

          textarea.select();
          textarea.setSelectionRange(0, textarea.value.length); // for mobile

          const success = document.execCommand('copy');
          document.body.removeChild(textarea);

          // Restore previous selection
          if (prevRange) {
            selection.removeAllRanges();
            selection.addRange(prevRange);
          }
          return success;
        } catch (e) {
          return false;
        }
      }

      copyBtn.addEventListener('click', async function () {
        const phone = phoneEl.textContent.trim();
        if (!phone) {
          showFeedback('Nothing to copy', 1200);
          return;
        }

        const ok = await copyTextToClipboard(phone);
        if (ok) {
          showFeedback('Copied!', 1600);
          // optional: move focus back to button for accessibility
          copyBtn.focus();
        } else {
          showFeedback('Copy failed — select & copy manually', 2200);
        }
      });

      // Allow copying by keyboard when pressing Enter/Space on the button (button already handles it,
      // but keep this comment to remind about accessibility).
    })();
